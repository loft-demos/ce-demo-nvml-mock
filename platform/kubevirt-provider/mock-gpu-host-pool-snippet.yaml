# Add to the KubeVirt provider cluster's own autoNodes (its VirtualClusterTemplate or
# vcluster.yaml), under privateNodes.autoNodes[].static. Snippet, not a full object.
#
# The mock GPU host: one ordinary machine (bare metal or a large VM with nested
# virtualization) that runs the simulated-GPU VMs. Nothing is bound to vfio-pci and
# no HostDevice selects it. Static: one dedicated machine, not autoscaled capacity.
# Size it for the NodeType's maxCapacity (4 x 1 CPU / 3 GiB, plus KubeVirt overhead).
- name: mock-gpu-host
  quantity: 1
  nodeLabels:
    kubevirt.io/schedulable: "true"
    # Pins the mock GPU NodeType here; every other NodeType avoids it.
    demo.vcluster.com/mock-gpu-host: "true"
  nodeTypeSelector:
    - property: vcluster.com/node-type
      value: MOCK_GPU_HOST_NODE_TYPE

# Already have a provider cluster node you want to use? Label it instead:
#   kubectl label node <node> demo.vcluster.com/mock-gpu-host=true
